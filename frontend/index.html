<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenVPN Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen" x-data="app()" x-cloak>

    <!-- Toast Notification -->
    <div x-show="toast.show" x-transition
         class="fixed top-4 right-4 z-50 px-4 py-3 rounded-lg shadow-lg text-white text-sm max-w-sm"
         :class="toast.type === 'error' ? 'bg-red-500' : 'bg-green-500'">
        <span x-text="toast.message"></span>
    </div>

    <!-- Login Screen -->
    <template x-if="!token">
        <div class="flex items-center justify-center min-h-screen">
            <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-sm">
                <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">OpenVPN Admin</h1>
                <form @submit.prevent="login()">
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input type="text" x-model="loginForm.username" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" x-model="loginForm.password" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    </div>
                    <button type="submit" :disabled="loading"
                            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 disabled:opacity-50 font-medium">
                        <span x-show="!loading">Sign In</span>
                        <span x-show="loading">Signing in...</span>
                    </button>
                </form>
            </div>
        </div>
    </template>

    <!-- Main App -->
    <template x-if="token">
        <div class="min-h-screen">
            <!-- Header -->
            <header class="bg-white shadow-sm">
                <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
                    <h1 class="text-xl font-bold text-gray-800">OpenVPN Admin</h1>
                    <button @click="logout()" class="text-sm text-gray-500 hover:text-gray-700">Logout</button>
                </div>
                <div class="max-w-7xl mx-auto px-4">
                    <nav class="flex space-x-1 border-b border-gray-200">
                        <button @click="tab = 'clients'" :class="tab === 'clients' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
                                class="px-4 py-2 text-sm font-medium border-b-2 -mb-px">Clients</button>
                        <button @click="tab = 'backup'" :class="tab === 'backup' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
                                class="px-4 py-2 text-sm font-medium border-b-2 -mb-px">Backup &amp; Restore</button>
                        <button @click="tab = 'logs'; fetchLogs()" :class="tab === 'logs' ? 'border-blue-500 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700'"
                                class="px-4 py-2 text-sm font-medium border-b-2 -mb-px">Logs</button>
                    </nav>
                </div>
            </header>

            <!-- Content -->
            <main class="max-w-7xl mx-auto px-4 py-6">

                <!-- Clients Tab -->
                <div x-show="tab === 'clients'">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold text-gray-800">VPN Clients</h2>
                        <div class="flex space-x-2">
                            <button @click="fetchClients()" class="px-3 py-1.5 text-sm bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                                Refresh
                            </button>
                            <button @click="showAddModal = true" class="px-3 py-1.5 text-sm bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                                + Add Client
                            </button>
                        </div>
                    </div>

                    <!-- Clients Table -->
                    <div class="bg-white rounded-lg shadow overflow-hidden">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Assigned IP</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Real Address</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Connected Since</th>
                                    <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200">
                                <template x-if="clients.length === 0">
                                    <tr>
                                        <td colspan="6" class="px-6 py-8 text-center text-gray-400">
                                            No clients configured. Click "Add Client" to create one.
                                        </td>
                                    </tr>
                                </template>
                                <template x-for="client in clients" :key="client.name">
                                    <tr class="hover:bg-gray-50">
                                        <td class="px-6 py-4 text-sm font-medium text-gray-900" x-text="client.name"></td>
                                        <td class="px-6 py-4 text-sm text-gray-600 font-mono" x-text="client.ip"></td>
                                        <td class="px-6 py-4">
                                            <span x-show="client.connected" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                                                <span class="w-1.5 h-1.5 bg-green-500 rounded-full mr-1.5"></span> Connected
                                            </span>
                                            <span x-show="!client.connected" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-600">
                                                <span class="w-1.5 h-1.5 bg-gray-400 rounded-full mr-1.5"></span> Disconnected
                                            </span>
                                        </td>
                                        <td class="px-6 py-4 text-sm text-gray-600 font-mono" x-text="client.real_address || '—'"></td>
                                        <td class="px-6 py-4 text-sm text-gray-600" x-text="client.connected_since || '—'"></td>
                                        <td class="px-6 py-4 text-right space-x-2">
                                            <button @click="downloadConfig(client.name)"
                                                    class="text-sm text-blue-600 hover:text-blue-800 font-medium">Download</button>
                                            <button @click="confirmRevoke = client.name"
                                                    class="text-sm text-red-600 hover:text-red-800 font-medium">Revoke</button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Backup & Restore Tab -->
                <div x-show="tab === 'backup'">
                    <h2 class="text-lg font-semibold text-gray-800 mb-4">Backup &amp; Restore</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white rounded-lg shadow p-6">
                            <h3 class="text-md font-semibold text-gray-700 mb-2">Download Backup</h3>
                            <p class="text-sm text-gray-500 mb-4">
                                Downloads a zip file containing all client configs, server configuration, PKI certificates, and IP assignments.
                            </p>
                            <button @click="downloadBackup()" :disabled="loading"
                                    class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 text-sm font-medium">
                                Download Backup
                            </button>
                        </div>
                        <div class="bg-white rounded-lg shadow p-6">
                            <h3 class="text-md font-semibold text-gray-700 mb-2">Restore Backup</h3>
                            <p class="text-sm text-gray-500 mb-4">
                                Upload a previously downloaded backup zip to restore all configuration. This will restart OpenVPN.
                            </p>
                            <input type="file" accept=".zip" @change="restoreFile = $event.target.files[0]"
                                   class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-3">
                            <button @click="restoreBackup()" :disabled="!restoreFile || loading"
                                    class="px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700 disabled:opacity-50 text-sm font-medium">
                                Restore Backup
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Logs Tab -->
                <div x-show="tab === 'logs'">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold text-gray-800">OpenVPN Logs</h2>
                        <div class="flex items-center space-x-3">
                            <label class="flex items-center space-x-2 text-sm text-gray-600">
                                <input type="checkbox" x-model="autoRefresh" @change="toggleAutoRefresh()"
                                       class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                <span>Auto-refresh (5s)</span>
                            </label>
                            <button @click="fetchLogs()" class="px-3 py-1.5 text-sm bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300">
                                Refresh
                            </button>
                        </div>
                    </div>
                    <div class="bg-gray-900 rounded-lg shadow p-4 overflow-auto max-h-[600px]">
                        <pre class="text-green-400 text-xs font-mono whitespace-pre-wrap" x-text="logs || 'No logs available.'"></pre>
                    </div>
                </div>
            </main>
        </div>
    </template>

    <!-- Add Client Modal -->
    <div x-show="showAddModal" class="fixed inset-0 z-40 flex items-center justify-center bg-black/50" @keydown.escape.window="showAddModal = false">
        <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md" @click.outside="showAddModal = false">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">Add New Client</h3>
            <form @submit.prevent="addClient()">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Client Name</label>
                    <input type="text" x-model="newClientName" required pattern="[a-zA-Z0-9_-]+"
                           placeholder="e.g. laptop, phone, tablet"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                    <p class="text-xs text-gray-400 mt-1">Alphanumeric, hyphens, and underscores only (max 32 chars)</p>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" @click="showAddModal = false"
                            class="px-4 py-2 text-sm text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200">Cancel</button>
                    <button type="submit" :disabled="loading"
                            class="px-4 py-2 text-sm text-white bg-blue-600 rounded-lg hover:bg-blue-700 disabled:opacity-50">
                        <span x-show="!loading">Create Client</span>
                        <span x-show="loading">Creating...</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Revoke Confirmation Modal -->
    <div x-show="confirmRevoke" class="fixed inset-0 z-40 flex items-center justify-center bg-black/50" @keydown.escape.window="confirmRevoke = null">
        <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md" @click.outside="confirmRevoke = null">
            <h3 class="text-lg font-semibold text-gray-800 mb-2">Revoke Client</h3>
            <p class="text-sm text-gray-600 mb-4">
                Are you sure you want to revoke <strong x-text="confirmRevoke"></strong>?
                This will permanently revoke their certificate and disconnect them.
            </p>
            <div class="flex justify-end space-x-2">
                <button @click="confirmRevoke = null"
                        class="px-4 py-2 text-sm text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200">Cancel</button>
                <button @click="revokeClient(confirmRevoke); confirmRevoke = null" :disabled="loading"
                        class="px-4 py-2 text-sm text-white bg-red-600 rounded-lg hover:bg-red-700 disabled:opacity-50">
                    Revoke
                </button>
            </div>
        </div>
    </div>

    <!-- Download Config Modal (shown after creating a client) -->
    <div x-show="createdConfig" class="fixed inset-0 z-40 flex items-center justify-center bg-black/50">
        <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md">
            <h3 class="text-lg font-semibold text-gray-800 mb-2">Client Created</h3>
            <p class="text-sm text-gray-600 mb-4">
                Client <strong x-text="createdClientName"></strong> has been created successfully. Download the configuration file below.
            </p>
            <div class="flex justify-end space-x-2">
                <button @click="createdConfig = null"
                        class="px-4 py-2 text-sm text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200">Close</button>
                <button @click="downloadCreatedConfig()"
                        class="px-4 py-2 text-sm text-white bg-blue-600 rounded-lg hover:bg-blue-700">
                    Download .ovpn
                </button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
